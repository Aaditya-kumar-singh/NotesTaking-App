version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kolkata
    # Pause routine Gradle version-bump PRs until the initial Android CI build
    # is stable; Dependabot security updates are handled separately by GitHub.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
