name: Android CI

on:
  # Local commits are free; each reviewed branch push publishes a batch and starts CI.
  # ** includes branch names with slashes (feature/, fix/, chore/, etc.).
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  # Run manually on a selected branch when a feature batch is ready.
  workflow_dispatch:
    inputs:
      full_abis:
        description: 'Build all three ABIs (native changes / full-device validation)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source, resources and attribution
    # Draft pull requests defer validation until the batch is ready for review.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify project structure, brand and assets
        run: python3 tools/ci/check_project.py

      - name: Verify backup and device-transfer privacy rules
        run: python3 tools/ci/check_backup_privacy.py

      - name: Check support scripts
        run: python3 -m py_compile tools/ci/check_project.py tools/ci/verify_apk.py tools/ci/check_backup_privacy.py

  build-debug:
    name: JDK 17 / tests / lint / debug APK
    needs: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process"
      # Default to ARM64 on feature branches; native/build changes select all three ABIs.
      CI_ARM64_ONLY: ${{ github.ref != 'refs/heads/main' && !inputs.full_abis }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select native ABI coverage
        id: abi_mode
        shell: bash
        run: |
          set -euo pipefail
          arm64_only="$CI_ARM64_ONLY"
          compare_base=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # PR checkout is the merge commit; its first parent is the target branch.
            compare_base=HEAD^1
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            # Compare the entire pushed batch, not only its last commit.
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^[0-9a-f]{40}$ && ! "$before" =~ ^0+$ ]]; then
              git cat-file -e "$before^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$before" || true
              if git cat-file -e "$before^{commit}" 2>/dev/null; then
                compare_base="$before"
              fi
            fi
            if [[ -z "$compare_base" ]]; then
              # Initial branch pushes and rewritten history use main as a safe baseline.
              git fetch --no-tags --depth=1 origin main
              compare_base=FETCH_HEAD
            fi
          fi
          if [[ -n "$compare_base" ]]; then
            changed=$(git diff --name-only "$compare_base" HEAD -- \
              app/src/main/cpp/ app/src/main/jniLibs/ \
              app/build.gradle.kts build.gradle.kts settings.gradle.kts \
              gradle.properties gradle/ \
              .github/workflows/android-ci.yml \
              .github/workflows/android-release.yml \
              tools/ci/verify_apk.py)
            if [[ -n "$changed" ]]; then
              arm64_only=false
              printf 'Native/build changes require all ABIs:\n%s\n' "$changed"
            fi
          fi
          echo "CI_ARM64_ONLY=$arm64_only" >> "$GITHUB_ENV"
          echo "arm64_only=$arm64_only" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install app's pinned SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Configure Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Kotlin unit tests, build APK, and lint
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            "-PciArm64Only=$CI_ARM64_ONLY" \
            :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Validate generated APK and both native libraries
        run: |
          abi_args=()
          if [[ "$CI_ARM64_ONLY" == "true" ]]; then
            abi_args=(--abi arm64-v8a)
          fi
          python3 tools/ci/verify_apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --package com.notestaking.app.debug \
            --aapt "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" \
            "${abi_args[@]}"
        shell: bash

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: NotesTakingApp-debug-${{ steps.abi_mode.outputs.arm64_only == 'true' && 'arm64' || 'all-abis' }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NotesTakingApp-ci-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
