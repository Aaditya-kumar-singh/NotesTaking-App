name: Bug report
description: Report a reproducible NotesTaking App problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include private notes, passwords, API keys or identifying documents."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the result you expected.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Notes, Canvas and stylus, PDF, Import or export, Storage and recovery, Settings, Native libraries, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
  - type: input
    id: device
    attributes:
      label: Android version and device model
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove personal or sensitive information before attaching.
